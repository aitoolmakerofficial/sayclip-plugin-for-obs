[app]
name = "SayClip"
version = "2.0.0"

[backend]
host = "127.0.0.1"
port = 17891
start_mode = "on_obs_start"

[backend.process]
python_path = ".venv/Scripts/pythonw.exe"
module = "instant_easy_rename_server"

[obs]
prefer_source_title = true
fallback_to_parent_folder = true

[setup]
completed = false
dependencies_installed = false
python_path = ""
venv_path = ""
completed_at = ""

[naming]
# Folder boundaries can be added with slashes, for example:
# format = "{source}/{job_type}/{title}"
# Compact mixed-folder names can use {short_source}:
# format = "{short_source}__{job_type}__{title}"
format = "{source}__{datetime}__{title}"
datetime_format = "%Y-%m-%d_%H-%M-%S"
include_job_type = true
unknown_game_token = "unknown-game"
title_language_mode = "keep"
keep_extension = true
on_conflict = "increment"

[naming.job_type_tokens]
recording = "rec"
moment = "clip"
extended_clip = "extended-clip"

[jobs]
max_jobs_in_ui = 50

[extended_clip]
enabled = true
# Recording runs for this long before SayClip saves its sequence Replay snapshot.
overlap_wait_seconds = 1.5
min_video_packets = 16
audio_packets = 8
seam_decode_seconds = 2.0
match_window_seconds = 3.0
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
runtime_path = ".local/extended-clip/session.json"
# Field-test rollout: MP4 or MKV sources currently publish a real MKV output.
output_container = "mkv"
# Sources are retained even after a successful merge until field testing is complete.
delete_sources_after_success = false

[audio]
device = "default"
max_record_seconds = 8
silence_stop_enabled = true
silence_seconds = 5
beep_start = true
beep_end = true
show_level_meter = true
keep_temp_audio = false

[stt]
engine = "faster_whisper"
model_path = ""
device = "cpu"
compute_type = "int8"
language = "ru"
offline_only = true
fake_transcript = "test voice title"

[logging]
log_path = "logs/instant_easy_rename_server.log"
level = "INFO"

[ui]
theme = "dark"
show_mic_meter = true
show_jobs_table = true
show_additional_setup = true
